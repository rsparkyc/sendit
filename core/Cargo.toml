[package]
name = "sendit-core"
version = "0.1.0"
edition = "2024"
description = "Bit-identical Rust port of the sendit physics hot path (phase one)."
publish = false

[lib]
crate-type = ["rlib"] # the wasm cdylib is built with `cargo rustc --crate-type cdylib` (scripts/build.sh)

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
