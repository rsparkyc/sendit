AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  sendit static site: private S3 bucket behind CloudFront (Origin Access Control),
  ACM certificate validated through Route 53 DNS, alias A/AAAA records.
  Must be deployed in us-east-1 (CloudFront only accepts ACM certificates from there).

Parameters:
  DomainName:
    Type: String
    Description: Fully qualified site name, e.g. sendit.example.com
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that contains DomainName
  # Leaderboard API (infra/leaderboard.yaml outputs). Empty: no /api/* routes (the site as before).
  LeaderboardSubmitOrigin:
    Type: String
    Default: ''
    Description: Leaderboard stack output SubmitOriginDomain (<id>.lambda-url.us-east-1.on.aws), or empty
  LeaderboardReadOrigin:
    Type: String
    Default: ''
    Description: Leaderboard stack output ReadOriginDomain, or empty

Conditions:
  HasLeaderboard: !And
    - !Not [!Equals [!Ref LeaderboardSubmitOrigin, '']]
    - !Not [!Equals [!Ref LeaderboardReadOrigin, '']]

Rules:
  RequireUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # No BucketName: CloudFormation generates one, so nothing account-specific is in the repo.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Caching follows the Cache-Control header each object carries (set by scripts/deploy.sh):
  #   /assets/*   public, max-age=31536000, immutable   (content-hashed file names)
  #   everything  public, max-age=0, must-revalidate    (index.html and other unhashed files)
  # MinTTL 0 lets max-age=0 really mean "revalidate"; DefaultTTL only applies to an object
  # uploaded without Cache-Control, and is kept short so a forgotten header cannot pin a stale page.
  CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-origin-headers'
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # Signs CloudFront's requests to the leaderboard function URLs (AuthType AWS_IAM).
  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasLeaderboard
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-lambda-oac'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # /api/*: cache only what the function marks cacheable (boards: max-age=10), keyed on the query string.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasLeaderboard
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  # Forward the viewer address (rate limiting). x-amz-content-sha256, which OAC needs to sign POSTs, is passed by CloudFront itself and is not allowed in a policy. No Host header (function URLs reject it).
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: HasLeaderboard
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        CookiesConfig: { CookieBehavior: none }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [CloudFront-Viewer-Address, content-type]
        QueryStringsConfig: { QueryStringBehavior: all }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins: !If
          - HasLeaderboard
          - - Id: s3-site
              DomainName: !GetAtt SiteBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - Id: leaderboard-submit
              DomainName: !Ref LeaderboardSubmitOrigin
              OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 60
            - Id: leaderboard-read
              DomainName: !Ref LeaderboardReadOrigin
              OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                OriginReadTimeout: 30
          - - Id: s3-site
              DomainName: !GetAtt SiteBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
        CacheBehaviors: !If
          - HasLeaderboard
          - - PathPattern: /api/leaderboard/submit
              TargetOriginId: leaderboard-submit
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed CachingDisabled (global id)
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /api/*
              TargetOriginId: leaderboard-read
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: !Ref ApiCachePolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CachePolicy

  AliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed, global hosted zone id of every CloudFront distribution
        EvaluateTargetHealth: false

  AliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
