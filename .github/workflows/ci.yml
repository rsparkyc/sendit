name: CI

# Layout (README, "CI"): independent jobs in parallel.
#   unit      typecheck + vitest
#   build     the production site, shared with the browser jobs as the artifact site-dist
#   engines   the cross-engine determinism suites (determinism, ephemeris), one job per engine
#   ui        the UI suites (incl. smoke and mobile) on Chromium in 5 shards and on WebKit in 6 shards
#   firefox   smoke.e2e.ts on headed Firefox under Xvfb (headless Linux Firefox has no WebGL)
#   report    merges every browser job's results into one HTML report (uploaded when something failed)
#   changes   lists the changed files; a documentation-only change (*.md, docs/) skips every job below
#   gate      "CI passed": the single required check for merging into main (every job above succeeded)
#   deploy    pushes to main only, after all of the above passed, and only while the repository
#             variable DEPLOY_ENABLED is 'true' (.github/workflows/deploy.yml)
# The SLOW=1 validation suites run in .github/workflows/slow.yml (weekly and on demand).

on:
  # Branch pushes are covered by their PR's run; pushes to main run the full gate and the deploy.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 12.8.1
  NODE_VERSION: 22

jobs:
  # Decides whether the change can affect the build or tests. A change that touches only documentation
  # (Markdown, docs/) skips every other job; the gate still reports, so the required check never hangs.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Anything besides documentation?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -vqE '(\.md$|^docs/)'; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  unit:
    name: Typecheck and unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm build
      - name: Build the leaderboard bundle
        run: pnpm build:leaderboard
      - name: Upload the site build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  engines:
    name: Determinism (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      PW_SUITE: engines
      PW_PREBUILT: '1'
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/e2e/blob-report
      PLAYWRIGHT_BLOB_OUTPUT_NAME: engines-${{ matrix.engine }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.engine }}
      - name: Install the browser and its system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "${{ matrix.engine }}"
      - name: Install the browser's system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "${{ matrix.engine }}"
      - name: Cross-engine determinism tests
        run: pnpm test:browsers --project="${{ matrix.engine }}"
      - name: Upload the blob report (for the merged report)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-engines-${{ matrix.engine }}
          path: e2e/blob-report/
          retention-days: 3
      - name: Upload this job's Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-engines-${{ matrix.engine }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  firefox:
    name: Smoke (Firefox, headed under Xvfb)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PW_SUITE: ui
      # Headless Firefox on Linux has no WebGL; headed under Xvfb it gets Mesa llvmpipe (docs/mobile-testing.md).
      PW_FIREFOX_HEADED: '1'
      # Without WebGL smoke.e2e.ts would skip its tests; here that must fail the job instead.
      REQUIRE_WEBGL: '1'
      PW_PREBUILT: '1'
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/e2e/blob-report
      PLAYWRIGHT_BLOB_OUTPUT_NAME: firefox-smoke.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-firefox
      - name: Install the browser and its system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps firefox
      - name: Install the browser's system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps firefox
      - name: Smoke tests (headed Firefox under Xvfb)
        run: xvfb-run -a pnpm test:browsers --project=firefox e2e/smoke.e2e.ts
      - name: Upload the blob report (for the merged report)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-firefox-smoke
          path: e2e/blob-report/
          retention-days: 3
      - name: Upload this job's Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-firefox-smoke
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  ui:
    name: UI (${{ matrix.engine }}, shard ${{ matrix.shard }}/${{ matrix.of }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # WebKit runs slower than Chromium on the Linux runners, so it gets one shard more.
        include:
          - { engine: chromium, shard: 1, of: 5 }
          - { engine: chromium, shard: 2, of: 5 }
          - { engine: chromium, shard: 3, of: 5 }
          - { engine: chromium, shard: 4, of: 5 }
          - { engine: chromium, shard: 5, of: 5 }
          - { engine: webkit, shard: 1, of: 6 }
          - { engine: webkit, shard: 2, of: 6 }
          - { engine: webkit, shard: 3, of: 6 }
          - { engine: webkit, shard: 4, of: 6 }
          - { engine: webkit, shard: 5, of: 6 }
          - { engine: webkit, shard: 6, of: 6 }
    env:
      PW_SUITE: ui
      PW_PREBUILT: '1'
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/e2e/blob-report
      PLAYWRIGHT_BLOB_OUTPUT_NAME: ui-${{ matrix.engine }}-${{ matrix.shard }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.engine }}
      - name: Install the browser and its system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps "${{ matrix.engine }}"
      - name: Install the browser's system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps "${{ matrix.engine }}"
      - name: UI suites
        run: pnpm test:browsers --project="${{ matrix.engine }}" --shard="${{ matrix.shard }}/${{ matrix.of }}"
      - name: Upload the blob report (for the merged report)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-ui-${{ matrix.engine }}-${{ matrix.shard }}
          path: e2e/blob-report/
          retention-days: 3
      - name: Upload this shard's Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ui-${{ matrix.engine }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  report:
    name: Browser test report
    needs: [engines, ui, firefox]
    if: ${{ !cancelled() && needs.ui.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into one HTML report and summarise
        env:
          ENGINES: ${{ needs.engines.result }}
          UI: ${{ needs.ui.result }}
          FIREFOX: ${{ needs.firefox.result }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/merged.json
        run: |
          pnpm exec playwright merge-reports --config e2e/playwright.config.ts --reporter html,json all-blob-reports
          node scripts/ci-browser-summary.mjs merged.json
      - name: Upload the merged Playwright report
        if: ${{ contains(needs.*.result, 'failure') || failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The one required status check for merging into main (branch protection): it passes only when every
  # verification job succeeded, so the required check doesn't change when jobs or shards are added.
  gate:
    name: CI passed
    needs: [changes, unit, build, engines, ui, firefox]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every verification job succeeded (or the change is documentation only)
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES, code: $CODE, results: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          [ "$CODE" = true ] || exit 0
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  deploy:
    name: Deploy
    needs: [unit, build, engines, ui, firefox]
    # Only a push to main in this repository (never a pull request, so never a fork), and only while the
    # kill switch is on. needs: makes every verification job a precondition.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      automatic: true
      version_change_acknowledged: false
    # Without this the called workflow's secrets context is empty, including the production
    # environment's role secret (seen on the first automatic run: no credentials could be loaded).
    secrets: inherit
